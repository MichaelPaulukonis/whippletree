[project]
name = "whippletree"
version = "0.1.0"
description = "A self-built coding-agent harness that benchmarks cross-model code review."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "openai>=3.42.1",
]

[project.scripts]
whippletree = "whippletree.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whippletree"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls a real model endpoint; run with: uv run pytest -m live"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # long lines are fine; no formatter churn

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
